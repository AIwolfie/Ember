name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax compilation check
      run: |
        python -m compileall ember tests

    - name: Smoke import check
      run: |
        python -c "import ember; import ember.models; import ember.storage; print('Ember modules imported cleanly!')"

    - name: Run Pytest Suite
      run: |
        pytest -v tests/

  flutter_ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ember_flutter

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Verify Dart code formatting
      run: dart format --output=none .

    - name: Static code analysis
      run: flutter analyze || true
